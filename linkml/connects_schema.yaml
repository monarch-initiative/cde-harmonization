  arm:
    title: Name of the study arm
    description: What was study treatment name?
    range: string
    annotations:
      variable: INTCAT
      variable_label: Name of the study arm
      implementation_notes: This variable is meant to capture the general arm of an
        intervention - in some cases this may be a specific drug name, and identical
        to INTTRT. In others, this may be a broader encompassing term to refer to
        an arm (e.g., a general treatment type). This element may be a masked response
        (e.g. "TREATMENT A" or a treatment verification code) that can be unmasked
        by the EDC. Please submit the unmasked version to BDC.
  treatment:
    title: Name of the treatment
    description: What was the name of the treatment administered?
    range: string
    annotations:
      variable: INTTRT
      variable_label: Name of the treatment
      implementation_notes: The CRF should collect some element that can be used to
        determine actual treatment received, since randomized arm may not be the arm
        actually received. This variable is meant to capture the specific treatment
        within an arm - this could be either a specific drug, a specific dosage, or
        other study-specific method meant to distinguish treatments within an arm.
        This element may be a masked response (e.g. "TREATMENT A" or a treatment verification
        code) that can be unmasked by the EDC. Please submit the unmasked version
        to BDC.
  treatment_occurrence:
    title: Exposure Occurrence
    description: Was [study treatment/dose] administered?
    range: SymptomaticEnum
    annotations:
      variable: INTOCCUR
      variable_label: Exposure Occurrence
      implementation_notes: 'The CRF should collect this element directly. It may
        be possible to derive this variable from other known variables (e.g. start
        date), but depending on EDC logic it may be difficult to differentiate missing
        start date vs. not-started.

        *If "NO", capture Occurrence specify (Reason). Refer to the CDE Manual for
        guidance on the remaining INT CDEs when Exposure is ''No''.'
  treatment_occurrence_reason:
    title: Exposure Reason for No Occurrence
    description: What was the reason that [study treatment/dose] did not occur?
    range: TreatmentOccurrenceReasonEnum
    annotations:
      variable: INTREASOC
      variable_label: Exposure Reason for No Occurrence
      implementation_notes: '*Only applicable when ECOCCUR="No".'
  treatment_completed:
    title: Exposure Completed
    description: Did the subject complete the full course of [study treatment/dose]?
    range: SymptomaticEnum
    annotations:
      variable: INTTRTCMP
      variable_label: Exposure Completed
      implementation_notes: This variable is often used to capture full dose per protocol
        and is recommended for raw data capture. Some studies may be able to derive
        post-collection based on other raw data elements. Study Protocol should define
        what constitutes the full, protocol dose.
  treatment_missed_doses:
    title: Number of Planned Doses that were Missed
    description: How many planned exposures were missed during the dosing interval?
    range: string
    annotations:
      variable: INTDOSMIS
      variable_label: Number of Planned Doses that were Missed
      implementation_notes: "A missed dose is, at minimum, a scheduled exposure in\
        \ which no intervention was administered within the exposure window. \nSome\
        \ studies may have stricter definitions of 'missed dose' (e.g. a partial dose\
        \ within the exposure window may be considered missed). Study Protocol should\
        \ determine thresholds for missed dose vs. an incomplete dose vs. a complete\
        \ dose."
  treatment_incomplete_doses:
    title: Number of Planned Doses that were Partial but Incomplete
    description: How many planned exposures were administered at a partial dose during
      dosing interval?
    range: string
    annotations:
      variable: INTDOSINC
      variable_label: Number of Planned Doses that were Partial but Incomplete
      implementation_notes: An incomplete/partial dose is a scheduled exposure in
        which only a portion of the planned intervention was administered. Study Protocol
        should determine thresholds for missed dose vs. an incomplete dose vs. a complete
        dose. Depending on these thresholds, exposures may only be complete or missed,
        making this variable non-applicable.
  treatment_completed_reason:
    title: Exposure Reason for Not Completed
    description: What was the reason that the full course of [study treatment/dose]
      was not completed?
    range: TreatmentCompletedReasonEnum
    annotations:
      variable: INTREACMP
      variable_label: Exposure Reason for Not Completed
      implementation_notes: '*Only applicable when INTTRTCMP="No".'
  dose_per_protocol:
    title: Treatment Dose, Planned
    description: What was the planned dose per administration of [study treatment/dose]?
    range: string
    annotations:
      variable: INTDOSPLN
      variable_label: Treatment Dose, Planned
      implementation_notes: Not for CRF; derive post-collection.
  dose_actual:
    title: Treatment Dose, Actual
    description: What was the actual dose per administration of [study treatment/dose]?
    range: string
    annotations:
      variable: INTDOSACT
      variable_label: Treatment Dose, Actual
      implementation_notes: Not applicable for "Full Course" intervals, recommended
        for "Per Exposure" intervals. Please be aware that some studies may need this
        variable for CDISC submission.
  dose_units:
    title: Dose Units
    description: What were the units for the dose?
    range: string
    annotations:
      variable: INTDOSU
      variable_label: Dose Units
      implementation_notes: This field is case sensitive. Not for CRF; derive post-collection.
        This unit is associated with the value of INTDOSPLN (and INTDOSACT, where
        included).
  dose_route:
    title: Dose Route of Administration
    description: What was the route of administration of [study treatment/dose]?
    range: string
    annotations:
      variable: INTDOSROUTE
      variable_label: Dose Route of Administration
      implementation_notes: Not for CRF; derive post-collection.
  dose_frequency:
    title: Dose Frequency
    description: What was the frequency of [study treatment/dose] dosing?
    range: string
    annotations:
      variable: INTDOSFRQ
      variable_label: Dose Frequency
      implementation_notes: 'Not for CRF; derive post-collection.

        This element is core since "Full Course" intervals are possible in this domain.'
