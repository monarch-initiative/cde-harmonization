slots:
  study_identifier:
    title: Study Identifier
    description: ''
    range: string
    annotations:
      variable: STUDYID
      variable_label: Study Identifier
      implementation_notes: DCC hard-code
  study_site:
    title: StudySite Identifier
    description: ''
    range: string
    annotations:
      variable: SITEID
      variable_label: StudySite Identifier
      implementation_notes: DCC hard-code
  subject_identifier:
    title: Subject Identifier for the Study
    description: '[derive]'
    range: string
    annotations:
      variable: SUBJID
      variable_label: Subject Identifier for the Study
  demographics_collection_date:
    title: Demographics Collection Date
    description: ''
    range: string
    annotations:
      variable: DMDAT
      variable_label: Demographics Collection Date
  full_name:
    title: full_name
    description: What is the participant’s full legal name at birth (i.e., maiden
      name if married)? Provide middle name or initial if possible
    range: string
    annotations:
      variable: --
      variable_label: full_name
      implementation_notes: Use for optional GUID, do not submit to BDC
  date_of_birth:
    title: Birth Date
    description: What is the participant’s date of birth?
    range: string
    annotations:
      variable: --
      variable_label: Birth Date
      implementation_notes: Use for optional GUID, do not submit to BDC
  city_of_birth:
    title: Birth City
    description: What is the participant’s city/municipality of birth?
    range: string
    annotations:
      variable: --
      variable_label: Birth City
      implementation_notes: Use for optional GUID, do not submit to BDC
  country_of_birth:
    title: Birth Country
    description: What is the participant’s country of birth?
    range: string
    annotations:
      variable: --
      variable_label: Birth Country
      implementation_notes: Use for optional GUID, do not submit to BDC
  street_address:
    title: Street Address
    description: What is the participant’s full street address for their residence?
    range: string
    annotations:
      variable: --
      variable_label: Street Address
      implementation_notes: Use for 9-digit ZIP, do not submit to BDC
  city_of_residence:
    title: City of Residence
    description: What is the city associated with the participant’s residential street
      address?
    range: string
    annotations:
      variable: --
      variable_label: City of Residence
      implementation_notes: Use for 9-digit ZIP, do not submit to BDC
  state_or_province_of_residence:
    title: State or Province of Residence
    description: What is the state associated with the participant’s residential street
      address?
    range: string
    annotations:
      variable: --
      variable_label: State or Province of Residence
      implementation_notes: Use for 9-digit ZIP, do not submit to BDC
  zip_code_of_residence:
    title: ZIP Code of Residence
    description: What is the participant's ZIP Code?
    range: string
    annotations:
      variable: --
      variable_label: ZIP Code of Residence
      implementation_notes: Use for 9-digit ZIP, do not submit to BDC
  country_of_residence:
    title: Country of Residence
    description: What is the participant's country of residence?
    range: string
    annotations:
      variable: --
      variable_label: Country of Residence
      implementation_notes: Use for 9-digit ZIP, do not submit to BDC
  age:
    title: Age
    description: '[derive]'
    range: string
    annotations:
      variable: AGE
      variable_label: Age
      implementation_notes: If deriving Age from a partial DOB, impute missing day
        to the first of the month and missing month to July
  ethnicity:
    title: Ethnicity
    description: Does the participant consider themselves Hispanic/Latino/Spanish
      or not Hispanic/Latino/Spanish?
    range: EthnicityEnum
    annotations:
      variable: ETHNIC
      variable_label: Ethnicity
  race:
    title: Race - AIAN
    description: 'Which of the following racial designations best describes the participant?
      More than one choice is acceptable: [American Indian or Alaska Native]'
    range: RaceEnum
    annotations:
      variable: DMAIAN
      variable_label: Race - AIAN
      implementation_notes: CRF should present Race as a single question with ‘check
        all that apply’
  biological_sex:
    title: Sex
    description: What is the sex of the participant?
    range: BiologicalSexEnum
    annotations:
      variable: SEX
      variable_label: Sex
  gender_identity:
    title: Gender Identity
    description: What terms best express how the participant describes their gender
      identity?
    range: GenderIdentityEnum
    annotations:
      variable: GENIDENT
      variable_label: Gender Identity
  gender_identity_branching:
    title: Gender Identity, Detailed
    description: Are any of these a closer description to the participant's gender
      identity?
    range: GenderIdentityBranchingEnum
    annotations:
      variable: GENIDDET
      variable_label: Gender Identity, Detailed
      implementation_notes: Recommended question language if response to GENIDENT
        is "nonbinary", "transgender" or "none of these"
  sexual_orientation:
    title: Sexual Orientation
    description: Which of the following best represents how the participant thinks
      of themselves?
    range: SexualOrientationEnum
    annotations:
      variable: SEXIDENT
      variable_label: Sexual Orientation
  sexual_orientation_branching:
    title: Sexual Orientation, Detailed
    description: Are any of these a closer description to how the participant thinks
      of themselves?
    range: SexualOrientationBranchingEnum
    annotations:
      variable: SEXIDDET
      variable_label: Sexual Orientation, Detailed
      implementation_notes: Recommended question language if repsonse to SEXIDENT
        is "None of these describes me, and I'd like to see additional options"
  health_insurance:
    title: Health Insurance
    description: What is the participant’s primary insurance?
    range: HealthInsuranceEnum
    annotations:
      variable: HINSUR
      variable_label: Health Insurance
  household_income:
    title: Household Income
    description: What is the participant's best estimate of the total income of all
      family members (related and living in the same household) from all sources,
      before taxes, in the last calendar year?
    range: string
    annotations:
      variable: HHINCOME
      variable_label: Household Income
  household_size:
    title: Household Size
    description: Approximately how many individuals (adult and children) live in the
      household/place that the participant lives?
    range: string
    annotations:
      variable: HHSIZE
      variable_label: Household Size
  type_of_dwelling:
    title: Type of Dwelling
    description: What type of dwelling does the participant live in?
    range: TypeOfDwellingEnum
    annotations:
      variable: DWELLING
      variable_label: Type of Dwelling
  space_in_home_to_self_isolate:
    title: Able to self-isolate
    description: If it were necessary, could a member of the participant's household
      isolate themselves from the rest of their household for as long as needed?
    range: SpaceInHomeToSelfIsolateEnum
    annotations:
      variable: SELFISO
      variable_label: Able to self-isolate
  able_to_get_food:
    title: Able to get food
    description: Does the participant have a way to get food if they need to self-isolate?
    range: SpaceInHomeToSelfIsolateEnum
    annotations:
      variable: FOODABLE
      variable_label: Able to get food
  food_insecurity:
    title: Food Insecurity
    description: Think of the statement ‘The food that (I/we) bought just didn’t last,
      and (I/we) didn’t have money to get more.’ Was that often, sometimes, or never
      true for (the participant/the participant's household) in the last 12 months?
    range: FoodInsecurityEnum
    annotations:
      variable: FOODSEC
      variable_label: Food Insecurity
  employment_status:
    title: Employee Job Class
    description: Before they got sick with COVID-19 - was the participant working,
      looking for work, retired, keeping house, a student, or something else?
    range: EmploymentStatusEnum
    annotations:
      variable: JOBCLAS
      variable_label: Employee Job Class
  paid_leave:
    title: Paid Leave
    description: Does the participant's job offer paid leave if they get sick?
    range: SpaceInHomeToSelfIsolateEnum
    annotations:
      variable: PAIDLV
      variable_label: Paid Leave
  work_from_home:
    title: Work from home
    description: Does the participant currently have the ability to work from home?
    range: SpaceInHomeToSelfIsolateEnum
    annotations:
      variable: WFH
      variable_label: Work from home
  household_work_from_home:
    title: Household work from home
    description: Is anyone in the participant's household currently working outside
      the home or physically attending school?
    range: SpaceInHomeToSelfIsolateEnum
    annotations:
      variable: WFHHH
      variable_label: Household work from home
  prior_employment_status:
    title: Prior Employment Status
    description: What did the participant do before March 2020?
    range: EmploymentStatusEnum
    annotations:
      variable: JOBPRIOR
      variable_label: Prior Employment Status
  educational_attainment:
    title: Level of Education Attained
    description: What is the highest level of education the participant has achieved
      outside or in the United States? Grades roughly equivalent to years of school.
    range: EducationalAttainmentEnum
    annotations:
      variable: EDULEVEL
      variable_label: Level of Education Attained
  preferred_language:
    title: Preferred Langauge
    description: What is the participant's preferred language to speak and write?
    range: PreferredLanguageEnum
    annotations:
      variable: LANGPREF
      variable_label: Preferred Langauge
  english_proficiency_branching:
    title: English Proficiency
    description: Would the participant say they speak English…
    range: EnglishProficiencyBranchingEnum
    annotations:
      variable: ENGLPROF
      variable_label: English Proficiency
      implementation_notes: Recommended question language if response to LANGPREF
        is any option other than "English"
  healthcare_access:
    title: Healthcare Access
    description: Is there a place that the participant USUALLY goes to when they are
      sick or need health care?
    range: HealthcareAccessEnum
    annotations:
      variable: HCAREACS
      variable_label: Healthcare Access
  healthcare_access_branching:
    title: Healthcare Access Location
    description: What kind of place is it that the participant goes to most often?
    range: HealthcareAccessBranchingEnum
    annotations:
      variable: HCARELOC
      variable_label: Healthcare Access Location
      implementation_notes: Recommended question language if response to HCAREACS
        is “Yes,” “More than one place,” or “Unknown”
  has_own_transportation:
    title: Personal Transportation
    description: Does the participant have access to their own mode of transportation?
    range: SpaceInHomeToSelfIsolateEnum
    annotations:
      variable: OWNTRNSP
      variable_label: Personal Transportation
  subject_identfier:
    title: Subject Identifier for the Study
    description: ''
    range: string
    annotations:
      variable: SUBJID
      variable_label: Subject Identifier for the Study
  medical_history_collection_date:
    title: Medical History Collection Date
    description: ''
    range: string
    annotations:
      variable: MHDAT
      variable_label: Medical History Collection Date
  copd:
    title: COPD
    description: Does the participant have a history of chronic obstructive pulmonary
      disease?
    range: CopdEnum
    annotations:
      variable: MHCOPD
      variable_label: COPD
  asthma:
    title: Asthma
    description: Does the participant have a history of asthma?
    range: CopdEnum
    annotations:
      variable: MHASTH
      variable_label: Asthma
  interstitial_lung_disease:
    title: Interstitial lung disease
    description: Does the participant have interstitial lung disease?
    range: CopdEnum
    annotations:
      variable: MHILD
      variable_label: Interstitial lung disease
  prior_to_current_illness_oxygen_support:
    title: Prior (to current illness) oxygen support
    description: Does the participant have a history of oxygen use (excluding sleep
      apnea devices) prior to becoming sick?
    range: CopdEnum
    annotations:
      variable: MHPRIORO2
      variable_label: Prior (to current illness) oxygen support
  prior_to_current_illness_oxygen_support_frequency:
    title: Prior (to current illness) oxygen support, frequency
    description: Was prior oxygen use intermittent or chronic (all the time)
    range: PriorToCurrentIllnessOxygenSupportFrequencyEnum
    annotations:
      variable: MHPRIORO2FRQ
      variable_label: Prior (to current illness) oxygen support, frequency
      implementation_notes: 'Recommend gating: only ask if response to "Prior (to
        current illness) oxygen support"="Yes"'
  pregnancy:
    title: Pregnancy
    description: Is the participant currently pregnant?
    range: CopdEnum
    annotations:
      variable: MHPREG
      variable_label: Pregnancy
  obesity:
    title: Obesity
    description: Is the participant obese (BMI ≥ 30.0)?
    range: CopdEnum
    annotations:
      variable: MHOBES
      variable_label: Obesity
      implementation_notes: Can derive based on BMI if unknown
  aids:
    title: AIDS
    description: Does the participant have AIDS (including definite or probable AIDS
      or AIDS-related complex (ARC))?
    range: CopdEnum
    annotations:
      variable: MHAIDS
      variable_label: AIDS
  hiv:
    title: HIV
    description: Is the participant HIV-positive without AIDS?
    range: CopdEnum
    annotations:
      variable: MHHIV
      variable_label: HIV
  immunosuppression:
    title: Immunosuppression
