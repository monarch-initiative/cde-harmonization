id: https://example.org/schemas/connects_cde
name: CONNECTS_CDESchema
description: A schema representing NHLBI CONNECTS COVID-19 Therapeutic Trial Common
  Data Elements (CDEs).
version: 1.0.0
default_range: string
license: https://creativecommons.org/publicdomain/zero/1.0/
imports:
- linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#
  connects: https://nhlbi-connects.org/cde/
default_prefix: connects
classes:
